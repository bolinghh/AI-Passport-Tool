[package]
name = "passport-codex-bridge"
version = "0.2.0"
edition = "2021"
license = "MIT"

[lib]
name = "passport_core"
crate-type = ["staticlib", "rlib"]

[dependencies]
anyhow = "1"
btleplug = "0.12"
cpal = "0.15"
eframe = { version = "0.31", optional = true, default-features = false, features = ["default_fonts", "glow", "accesskit", "wayland", "x11"] }
futures = "0.3"
opus = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
uuid = "1"
dirs = "6"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Devices_Bluetooth", "Devices_Bluetooth_GenericAttributeProfile", "Devices_Enumeration", "Foundation"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[profile.release]
lto = "thin"
strip = true
